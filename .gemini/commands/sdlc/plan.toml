description = "執行 SDLC 規劃：實際委派 SA / DB Agent、建立技術規格與 Workflow State，並停在 Development Gate。"
prompt = """
# /sdlc:plan - SDLC Planning

你正在執行 skills-hub workspace 的 `/sdlc:plan` command。

使用者需求：
{{args}}

## Governing Rules

必須遵守：

- `GEMINI.md`
- @{docs/playbooks/workflow/sdlc-pipeline.md}
- @{docs/playbooks/workflow/workflow-state.md}

本 command 只能對目標專案做 read-only analysis。

唯一允許的檔案 mutation 是使用 `write_sdlc_artifact` 新增 generated artifacts；不得使用一般 `write_file` 把 SDLC 文件寫入目標專案、使用者 `.gemini` 或 CLI temporary directory。

任何 DB query 都只能透過 `dbMetadata` configured aliases，且只能 read-only。不得使用目標專案的 `web.config`、`appsettings.json`、程式碼或 prompt 內 raw connection string 建立 DB connection。

## Required Agent Invocation

本 command 由 Main Orchestrator 負責協調，但以下工作必須實際委派：

1. 實際呼叫 `sa-agent` 完成需求、Scope、Acceptance Criteria、系統影響、風險與 handoff。
2. 若需求涉及 table、column、SQL、report、stored procedure、import/export、migration、資料同步、資料正確性或 Data Flow，實際呼叫 `db-agent`。
3. 若沒有 DB impact，`db-agent` 可標示 `Skipped`，但必須寫明判斷依據。

不得只模擬 Agent 視角後宣稱已呼叫 subagent。

## Target Project Configuration Policy

目標專案設定檔只可用於判斷：

- 語言、framework、runtime、dependency version。
- Build target、compiler、IIS / hosting / deployment mode。
- Config transform、assembly binding、globalization、encoding。
- 非敏感常數、feature flag name、connection string name 與 provider type。

不得讀取、回傳或使用 connection string value、server、user ID、password、token 或 secret。

## DB Connection Selection

DB Agent 若需要 metadata，必須依序：

1. 呼叫 `list_connections`。
2. 多組 alias 時呼叫 `suggest_connection`。
3. 只有 alias、environment、system、database 或 tags 明確符合時才選定 `connection_key`。
4. 候選不明確時要求使用者確認。
5. 沒有 configured alias 時標示 `Needs More Evidence`，不得 fallback。

所有 DB mutation 永遠禁止。只可產生 proposal SQL artifact，不可執行。

## Required Workflow

1. 確認 Request Source 與 Target Project。
2. 建立 Project / Version Context。
3. 列出 Playbooks Used。
4. 實際呼叫 `sa-agent`。
5. 判斷 DB Impact；需要時實際呼叫 `db-agent`。
6. 整合 Requirement Summary、In Scope、Out of Scope、Assumptions、Open Questions、Acceptance Criteria。
7. 整合 DB Impact、Affected Objects、Migration Direction、Rollback Direction 與 Validation Direction。
8. 產生 Implementation Plan、Expected File Changes、Expected DB Changes、Test Strategy、Review Strategy 與 Release / Rollback Direction。
9. 呼叫 `get_sdlc_artifact_config`，確認實際 artifact root。
10. 使用 `write_sdlc_artifact` 建立 SA 技術規格。
11. 若 DB change 被建議且資訊足夠，使用 `write_sdlc_artifact` 建立 DB impact 與 SQL proposal artifacts。
12. 使用 `write_sdlc_artifact` 建立 Workflow State。
13. 停在 `SA / DB → Development` Gate，要求使用者明確核准。

## Required Artifacts

必須建立：

- category=`sa-spec`：`YYYYMMDD_<project>_<feature>_tech-spec.md`
- category=`workflow`：`<workflow-id>/state.md`

若有 DB change proposal 且資料規則足夠，建立：

- category=`db`：`YYYYMMDD_<project>_<feature>_db-impact.md`
- category=`db`：`YYYYMMDD_<project>_<feature>_migration-proposal.sql`
- category=`db`：`YYYYMMDD_<project>_<feature>_rollback-proposal.sql`
- category=`db`：`YYYYMMDD_<project>_<feature>_validation-readonly.sql`

SQL 檔案開頭必須包含：

```sql
-- PROPOSAL ONLY
-- DO NOT EXECUTE AUTOMATICALLY
-- Generated by skills-hub SDLC
-- Human review and manual execution are required.
```

若 DB 規則或 schema evidence 不足，不得憑空產生可執行 SQL；只建立 DB impact report，並列出 Open Questions。

## Gate Rule

`SA / DB → Development` 只有在以下條件成立時才可標示 `Ready for Approval`：

- Target Project 與 Version Context 足夠。
- SA Analysis 完整。
- DB Impact 已完成、Skipped 或明確 Blocked。
- Expected File / DB Changes 已列出。
- Test、Review、Release 與 rollback direction 已列出。
- 必要 artifacts 已成功建立。
- 無 blocking Open Question。

## Required Output

# SDLC Plan Result

## 1. Requirement Summary
## 2. Request Source and Target Project
## 3. Project / Version Context
## 4. Playbooks Used
## 5. SA Analysis
## 6. DB / Data Impact Analysis
## 7. Implementation Plan
## 8. Expected File Changes Proposal
## 9. Expected DB Changes Proposal
## 10. Test / Review / Release Direction
## 11. Risks and Open Questions
## 12. Generated Artifacts

| Category | Path | Status | Notes |
|---|---|---|---|

## 13. Agent Execution Trace

| Sequence | Stage | Agent | Invocation Type | Skill | Result | Artifact |
|---|---|---|---|---|---|---|

`Invocation Type` 只能是 `Actual Subagent`、`Main Orchestrator`、`Perspective Only` 或 `Skipped`。

## 14. Workflow State Snapshot
## 15. Gate Decision Required

最後必須詢問：

> 目前已停在 `SA / DB → Development` Gate。是否同意依照本次產出的技術規格、DB proposal 與 Workflow State 進入 `/sdlc:implement`？
"""

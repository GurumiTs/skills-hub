description = "建立 compact Project Context、實際委派 SA / DB Agent、產生規格與 Workflow State，並停在 Development Gate。"
prompt = """
# /sdlc:plan - SDLC Planning

使用者需求：
{{args}}

遵守 `GEMINI.md`。本階段對目標專案只能 read-only；唯一允許的檔案 mutation 是使用 `write_sdlc_artifact` 新增 generated artifacts。DB 只能使用 configured aliases 做 read-only metadata lookup。

## Required Flow

1. 確認 Request Source、Target Project、目標與限制。
2. 呼叫 `inspect_project_context` 取得 compact Project Context；不要先讀完整 manifests。
3. 只有 compact result 缺失且會影響規劃時，才讀取最小必要 manifest；不得讀取或輸出 connection value / secret。
4. 實際呼叫 `sa-agent`，產出 Scope、Acceptance Criteria、Assumptions、Open Questions、Risk 與 implementation handoff。
5. 需求涉及 DB / SQL / report / migration / data flow 時，實際呼叫 `db-agent`；否則記錄 `Skipped` 與理由。
6. 整合 Implementation Plan、Expected File Changes、Dependency / Build impact、Encoding Policy、Test / Review / Release direction。
7. 呼叫 `get_sdlc_artifact_config`，建立 SA tech spec 與 Workflow State。
8. DB evidence 足夠時建立 DB impact 與 proposal-only SQL；資訊不足時只建立 impact report 與 Open Questions。
9. 停在 `SA / DB → Development` Gate。

## Project Context Contract

Workflow State 只保存 compact snapshot：

- Project type、language / version、runtime / framework
- Package manager、direct dependency source、resolved dependency source
- Build target、compiler、hosting / deployment
- Encoding policy、BOM、line ending
- DB connection names/providers（value redacted）
- Evidence fingerprints 與 `context_fingerprint`

後續階段 fingerprint 未變時必須重用，不重讀完整 manifests。

## Required Artifacts

- `sa-spec`: `YYYYMMDD_<project>_<feature>_tech-spec.md`
- `workflow`: `<workflow-id>/state.md`

DB change evidence 足夠時：

- `db`: `YYYYMMDD_<project>_<feature>_db-impact.md`
- `db`: `YYYYMMDD_<project>_<feature>_migration-proposal.sql`
- `db`: `YYYYMMDD_<project>_<feature>_rollback-proposal.sql`
- `db`: `YYYYMMDD_<project>_<feature>_validation-readonly.sql`

SQL 必須標示 `PROPOSAL ONLY`、`DO NOT EXECUTE AUTOMATICALLY` 與人工審查要求。

## Gate

只有以下條件成立才可標示 `Ready for Approval`：

- Target Project、Acceptance Criteria、Scope 清楚
- Project Context 足以支撐實作
- DB Impact 已完成、Skipped 或明確 Blocked
- Expected File / Dependency / DB Changes 與 rollback direction 已列出
- 必要 artifacts 已成功建立
- 無 blocking Open Question

## Required Output

# SDLC Plan Result

## Requirement and Scope
## Project Context Snapshot
## SA Analysis
## DB Impact
## Implementation / Test / Review / Release Direction
## Expected Changes
## Risks and Open Questions
## Generated Artifacts
## Agent Execution Trace
| Sequence | Stage | Agent | Invocation Type | Result | Artifact |
|---|---|---|---|---|---|

## Workflow State Snapshot
## SA / DB → Development Gate

最後詢問是否同意進入 `/sdlc:implement`。
"""

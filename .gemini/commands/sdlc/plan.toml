description = "執行唯讀 SDLC 規劃階段：需求輸入、SA 分析、DB 影響判斷、實作計畫與 Gate 決策。"
prompt = """
# /sdlc:plan - SDLC 規劃階段

你正在執行 skills-hub workspace 的 `/sdlc:plan` command。

使用者需求：
{{args}}

## 1. 上層規則

本 command 不得覆蓋或繞過以下上層規則：

- 根目錄 `GEMINI.md` 的 Change Control、Secrets 保護、安全限制、檔案修改前確認流程與回滾要求。
- `docs/playbooks/workflow/sdlc-pipeline.md` 定義的 SDLC Pipeline、Gate 與 Blocking Rule。
- `docs/playbooks/workflow/workflow-state.md` 定義的 Workflow State 格式。

若本 command 與 `GEMINI.md` 發生衝突，必須優先遵守 `GEMINI.md`。

## 2. 執行模式

本 command 只能執行唯讀規劃。

允許：

- 讀取使用者明確指定或與任務直接相關的檔案、議題、文件、程式碼、設定或 metadata。
- 產生分析、規劃、草稿、建議、預期異動清單、測試策略與 Gate 判斷。
- 提出後續可能需要的檔案或 DB 變更提案。

禁止：

- 新增、修改、刪除、搬移、覆寫、格式化任何實體檔案。
- 執行會造成檔案異動、DB 異動、部署、外部系統更新或 package 更新的指令。
- 把未確認的需求、DB 規則、權限、部署方式或回滾方式寫成已確認事實。
- 在 Gate 未通過前引導使用者直接進入實作。

## 3. 語言與術語

輸出以繁體中文為主。

以下工程術語可保留英文，以維持精準且便於團隊溝通：Scope、In Scope、Out of Scope、Assumption、Open Question、Acceptance Criteria、Gate、Handoff、Rollback、Blocking Issue、Workflow State、Read-only、Mutation、Test Report、Dry Run。

## 4. 權威參考

執行時應優先參考：

- Root governance: `GEMINI.md`
- SDLC pipeline and gates: @{docs/playbooks/workflow/sdlc-pipeline.md}
- Workflow state format: @{docs/playbooks/workflow/workflow-state.md}

## 5. Agent / Skill 使用原則

本 command 應以 Workflow Orchestrator 視角執行，但需要套用下列角色能力：

| 任務內容 | Agent 視角 | Skill 能力 |
|---|---|---|
| 需求輸入、階段判斷、Gate 判斷 | Workflow Orchestrator | 不直接實作 Skill，只負責協調 |
| 需求釐清、SA 規格、影響分析 | SA Agent | `sa-consultant` |
| DB / SQL / Schema / Data Flow 影響 | DB Agent | `db-engineering` |
| 實作方式與預期檔案異動 | Developer Agent | `developer-implementer`，僅做計畫，不實作 |
| 測試策略、Dry Run 方向、Test Report 預期 | Test Agent | `test-engineer`，僅做測試規劃 |
| 發布與回滾方向 | Release Agent | `release-ops`，僅做方向規劃 |

## 6. DB / Data Impact 觸發條件

只要需求涉及以下任一項，就必須執行 DB / Data Impact Analysis，不得跳過：

- table、column、index、view、stored procedure、function、trigger。
- SQL、report query、查詢條件、排序、分頁、統計、匯總。
- import / export、資料同步、批次、排程、資料轉換。
- migration、資料修補、預設值、歷史資料、資料正確性。
- 權限資料、角色資料、設定資料、狀態機、審核流程資料。
- API 或系統整合中的資料流變更。

若不確定是否涉及 DB，必須標示為 `DB Impact: Unknown`，並列為 Open Question 或 Gate Blocker。

## 7. 必要流程

1. 判斷需求來源：Manual Prompt、Redmine、GitHub Issue、Log、既有文件、程式碼觀察或 Incident。
2. 確認目標專案：使用者指定路徑、目前 workspace、`/directory` context，或明確指出目前資訊不足。
3. 整理 Requirement Summary、背景、限制與使用者目標。
4. 執行 SA Analysis，至少包含 In Scope、Out of Scope、Assumptions、Open Questions、Acceptance Criteria。
5. 判斷 DB / Data Impact 是否需要執行，並說明判斷理由。
6. 若需要 DB 分析，產出 DB Impact Summary、Affected Objects、Migration / Rollback Direction；若資訊不足，標示 blocker。
7. 產出 Implementation Plan，但只能是 proposal，不得直接修改檔案。
8. 列出 Expected File Changes 與 Expected DB Changes，並標示 `Proposal Only`。
9. 產出 Test Strategy、Dry Run Direction、Review Strategy、Release / Rollback Direction。
10. 產出 Workflow State Snapshot，方便後續 `/sdlc:implement`、`/sdlc:test`、`/sdlc:review`、`/sdlc:release` 接續使用。
11. 停在 `SA / DB → Development` Gate，要求使用者明確確認後才可進入 `/sdlc:implement`。

## 8. Gate 判斷規則

`SA / DB → Development` Gate 只有在以下條件都成立時才可標示為 `Ready for Approval`：

- Requirement Summary 清楚。
- In Scope / Out of Scope 已列出。
- Acceptance Criteria 已列出，或已明確說明目前缺口。
- DB / Data Impact 已判斷；若有 DB 影響，已完成初步分析。
- Expected File Changes 與 Expected DB Changes 已列出為 proposal。
- 主要風險、驗證方式與 rollback direction 已列出。
- 無 blocking Open Question。

若任一條件不成立，Gate 狀態必須是 `Blocked` 或 `Pending`，不得建議直接實作。

## 9. 必要輸出格式

# SDLC Plan

## 1. Requirement Summary

## 2. Request Source and Target Project

## 3. Current Context and Confirmed Facts

## 4. SA Analysis

### 4.1 In Scope

### 4.2 Out of Scope

### 4.3 Assumptions

### 4.4 Open Questions

### 4.5 Acceptance Criteria

## 5. DB / Data Impact Analysis

### 5.1 DB Impact Decision

### 5.2 Affected Objects

### 5.3 Migration Direction

### 5.4 Rollback Direction

### 5.5 DB Open Questions

## 6. Implementation Plan

## 7. Expected File Changes Proposal

| Action | Path | Reason | Risk | Notes |
|---|---|---|---|---|

## 8. Expected DB Changes Proposal

| Type | Object | Reason | Rollback Direction | Notes |
|---|---|---|---|---|

## 9. Test Strategy and Dry Run Direction

## 10. Review Strategy

## 11. Release and Rollback Direction

## 12. Risks

| Severity | Risk | Impact | Mitigation | Owner |
|---|---|---|---|---|


description = "依 Test Report 與 compact Project Context 執行 DB、Code、Security 與 encoding compatibility review。"
prompt = """
# /sdlc:review - SDLC Review

使用者需求：
{{args}}

遵守 `GEMINI.md`。沒有完整 Test Report、等效證據或 `Test → Review = Approved` 時停止。Review 預設 read-only。

## Required Flow

1. 讀取 approved scope、modified files、Test Report、DB changes 與 compact Workflow State。
2. Project Context fingerprint 未變時重用；變更或缺失時才重新 `inspect_project_context`。
3. 實際呼叫 `review-agent` 執行 correctness、maintainability、version / dependency compatibility 與 regression review。
4. 涉及 DB / SQL / data flow 時實際呼叫 `db-agent`；否則標示 `Skipped` 與理由。
5. 實際呼叫 `security-agent` 檢查 secret、input、permission、dependency、configuration 與 data exposure risk。
6. 對 modified text files 驗證 encoding、BOM、line ending；意外轉碼、移除必要 BOM 或整檔換行漂移視為 compatibility finding。
7. 彙整 Blocking / High / Medium / Low / Suggestion；Blocking 或 unresolved High 不得進入 Release。

## Required Output

# SDLC Review Report

## Scope and Evidence
## Project Context Used
## Test Evidence Decision
## Version / Dependency / Encoding Compatibility
## DB Review
## Code Review
## Security Review
## Findings
| Severity | Area | Finding | Impact | Recommendation | Gate Impact |
|---|---|---|---|---|---|

## Agent Execution Trace
| Sequence | Stage | Agent | Invocation Type | Result | Artifact |
|---|---|---|---|---|---|

## Workflow State Update
## Security → Release Gate

可進入下一階段時，最後詢問是否同意進入 `/sdlc:release`。
"""

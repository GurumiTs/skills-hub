## 10. Mutating Operation 提案格式

當任何階段需要檔案、DB、部署、設定、package 或外部系統異動時，必須先停止並輸出：

# Change Proposal Required

## 1. Risk Assessment

## 2. Proposed Changes

| Action | Target | Reason | Risk | Rollback |
|---|---|---|---|---|

## 3. Validation Plan

## 4. Rollback Plan

## 5. Required User Approval

最後必須詢問使用者是否同意套用變更。
"""

description = "依 Workflow State 路由 SDLC 階段與 Gate，避免重複載入完整規則或不必要 Agent。"
prompt = """
# /sdlc:run - Interactive SDLC Router

使用者需求：
{{args}}

遵守 `GEMINI.md`。本 command 只負責判斷 Current Stage、Required Agent、Gate 與下一步，不複製各階段完整工作方法。

## Routing

- 無 Workflow State：執行 `/sdlc:plan` 等效流程。
- `SA / DB → Development = Approved`：進入 implementation。
- `Development → Test = Approved`：進入 test。
- `Test → Review = Approved`：進入 review。
- `Security → Release = Approved`：進入 release。
- Gate 未核准、Blocked 或 Needs More Evidence：停止並回報缺口。

## Context Economy

- 優先讀取 compact Workflow State。
- Project Context fingerprint 未變時重用 snapshot，不重讀 manifests。
- 只在目前 Stage 適用時呼叫對應 Agent；DB Agent 僅 DB impact，其他不適用 Agent 標示 `Skipped`。
- Playbook 只在目前技術證據需要細節時按需讀取，不使用 file content injection 無條件載入完整文件。
- 更新 Workflow State 時建立 versioned artifact，不覆寫既有 state。

## Required Output

# SDLC Pipeline Status

## Current Stage and Gate
## Target Project
## Compact Project Context
## Output / Generated Artifacts
## Agent Execution Trace
| Sequence | Stage | Agent | Invocation Type | Result | Artifact |
|---|---|---|---|---|---|

## Blocking Issues
## Required User Decision
## Workflow State Update

任何一般檔案修改、測試 execution、外部系統 mutation 或部署仍需依 `GEMINI.md` 取得核准。
"""

description = "依 Implementation Result 與 compact Workflow State 執行測試、encoding verification 與 Test → Review Gate。"
prompt = """
# /sdlc:test - SDLC Test

使用者需求：
{{args}}

遵守 `GEMINI.md`。找不到 `Development → Test = Approved` 或等效核准時停止。預設只做 Planning / Dry Run / Evidence Review；會造成 mutation 的 execution 需另行核准。

## Required Flow

1. 讀取 Implementation Result、Acceptance Criteria、modified files 與 compact Workflow State。
2. Project Context fingerprint 未變時直接重用；變更時才呼叫 `inspect_project_context`。
3. 實際呼叫 `test-agent`，建立 Test Scope、Cases、Edge Cases、Test Data、Regression Scope 與 execution status。
4. 對每個新增或修改的文字檔呼叫 `inspect_text_encoding`，比對 Implementation Result 與 Workflow State encoding policy。
5. DB evidence 只有在需求涉及 DB 且必要時才呼叫 `db-agent`，並只使用 configured alias / read-only query。
6. 未實際執行的測試標示 `Not Tested`；不得把 Dry Run 寫成 Pass。
7. Encoding / BOM / line ending 不符、Acceptance Criteria 無證據或有 blocking failure 時，`Test → Review` 必須 Blocked。

## Test Modes

`Planning`、`Dry Run`、`DB-assisted Dry Run`、`Evidence Review`、`Execution`。只有有效 execution evidence 才可標示 Pass。

## Required Output

# SDLC Test Report

## Mode and Inputs
## Project Context Used
## Test Scope / Cases / Regression
## Encoding Verification
| File | Expected | Actual | BOM | Line Ending | Status |
|---|---|---|---|---|---|

## DB-assisted Evidence
## Execution Result
## Failed / Blocked / Not Tested Items
## Risks and Handoff
## Agent Execution Trace
| Sequence | Stage | Agent | Invocation Type | Result | Artifact |
|---|---|---|---|---|---|

## Workflow State Update
## Test → Review Gate

最後詢問是否同意進入 `/sdlc:review`。
"""

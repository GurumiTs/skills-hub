## 15. Gate Decision Required

最後必須明確詢問使用者是否同意進入 `/sdlc:review`。

範例：

> 目前已停在 `Test → Review` Gate。是否同意依照以上 Test Report 進入 `/sdlc:review`，進行 DB Review、Code Review 與 Security Review？

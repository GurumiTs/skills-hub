description = "依 approved Gate 與 compact Project Context 執行 encoding-safe 實作，並停在 Development → Test Gate。"
prompt = """
# /sdlc:implement - SDLC Implementation

使用者需求：
{{args}}

遵守 `GEMINI.md`。找不到使用者明確核准或 `SA / DB → Development = Approved` 時立即停止。

## Required Flow

1. 讀取 approved scope、Acceptance Criteria、Expected Changes 與 Workflow State。
2. 比對 Project Context evidence fingerprints：
   - 未變更：重用 snapshot。
   - 缺失或變更：呼叫 `inspect_project_context` 更新 compact context。
3. 實際呼叫 `developer-agent`，傳入 approved scope、compact context、Expected Changes 與 DB Impact Result。
4. 只讀取本次實作直接相關的 source files；原始 manifests 只在 compact context 無法支撐判斷時讀取。
5. 既有文字檔先呼叫 `inspect_text_encoding`，使用 `write_file` 的 preserve mode。
6. 新增檔案依同目錄同副檔名、Project Context 與 Developer Skill 明確選擇 encoding / line ending。
7. 新增 dependency、更新 lock file、改 build/runtime target、擴大 scope 或增加 DB change 前停止並提出新的 Change Proposal。
8. DB 只使用已核准 DB Impact / proposal；不得建立 DB connection 或執行 SQL mutation。
9. 整理 post-write encoding verification、自測、風險與 rollback direction。
10. 停在 `Development → Test` Gate。

## Blocking Conditions

- Approval、Target Project、Scope 或 Acceptance Criteria 不清
- Project Context / dependency evidence 不足且影響實作
- DB Impact 缺失
- 無法保留 encoding、BOM 或 line ending
- 需要未核准的 dependency / build / runtime / scope 變更
- 發現 secret 或重大不可 rollback 風險

## Required Output

# SDLC Implementation Result

## Approval and Scope
## Project Context Used
## Modified Files
| Action | Path | Summary | Encoding Before | Encoding After | BOM | Line Ending | Verification |
|---|---|---|---|---|---|---|---|

## Dependency / Build Notes
## DB Notes
## Implementation Summary
## Self-test and Rollback
## Risks / Follow-up
## Agent Execution Trace
| Sequence | Stage | Agent | Invocation Type | Result | Artifact |
|---|---|---|---|---|---|

## Workflow State Update
## Development → Test Gate

未實際執行測試時必須標示 `Not Executed`。最後詢問是否同意進入 `/sdlc:test`。
"""
